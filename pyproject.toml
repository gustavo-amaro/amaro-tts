[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore:.*found in sys.modules.*:RuntimeWarning",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*"]
